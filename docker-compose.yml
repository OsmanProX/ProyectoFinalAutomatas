# ============================================================================
# Levantar la app con Docker:
#   docker compose up -d --build     (construye e inicia)
#   docker compose logs -f app       (ver la consola)
#   docker compose down              (detener)
# La base de datos MySQL es la centralizada del curso (DB_HOST en .env).
# ============================================================================
services:
  app:
    build: .
    image: proyecto-automatas:latest
    container_name: proyecto-automatas
    env_file:
      - .env
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
